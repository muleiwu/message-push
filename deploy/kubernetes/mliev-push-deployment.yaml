apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o kubernetes/
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: mliev-push
  name: mliev-push
  namespace: mliev-push
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mliev-push
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o kubernetes/
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: mliev-push
    spec:
      containers:
        - image: docker.cnb.cool/mliev/open/mliev-push:develop
          name: mliev-push
          ports:
            - containerPort: 8080
              protocol: TCP
          # 可选：JWT 与 OIDC SSO 登录（也可写入挂载的 config.yaml）
          # env:
          #   - name: JWT_SECRET
          #     valueFrom:
          #       secretKeyRef:
          #         name: mliev-push-secrets
          #         key: jwt-secret
          #   - name: OIDC_ENABLED
          #     value: "true"
          #   - name: OIDC_ISSUER
          #     value: "https://idp.example.com/realms/main"
          #   - name: OIDC_CLIENT_ID
          #     value: "mliev-push"
          #   - name: OIDC_CLIENT_SECRET
          #     valueFrom:
          #       secretKeyRef:
          #         name: mliev-push-secrets
          #         key: oidc-client-secret
          #   - name: OIDC_REDIRECT_URL
          #     value: "https://push.example.com/api/admin/auth/oidc/callback"
          #   - name: OIDC_DISABLE_PASSWORD_LOGIN   # 仅 SSO 登录（OIDC 可用时才生效）
          #     value: "true"
          volumeMounts:
            - mountPath: /app/config
              name: mliev-push-claim0
      restartPolicy: Always
      volumes:
        - name: mliev-push-claim0
          persistentVolumeClaim:
            claimName: mliev-push-claim0
