services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: message_push_test
      POSTGRES_USER: message_push
      POSTGRES_PASSWORD: message_push
    ports:
      - "${POSTGRES_TEST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U message_push -d message_push_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: message_push_test
      MYSQL_USER: message_push
      MYSQL_PASSWORD: message_push
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${MYSQL_TEST_PORT:-53306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 2s
      retries: 45
